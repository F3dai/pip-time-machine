<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pip Time Machine</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⏱️</text></svg>">
  <style>
    :root {
      --text: #343541;
      --bg: #ffffff;
      --border: #e5e5e5;
      --hover: #f7f7f8;
      --muted: #6e6e80;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      background: var(--bg);
      max-width: 640px;
      margin: 0 auto;
      padding: 32px 20px;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 6px; }
    .tagline { color: var(--muted); font-size: 14px; }

    .input-section {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
    }

    textarea {
      width: 100%;
      min-height: 120px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-family: monospace;
      font-size: 14px;
      resize: vertical;
      margin-bottom: 12px;
    }

    textarea:focus { outline: none; border-color: var(--text); }

    .controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    input[type="date"], select {
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 14px;
      background: var(--bg);
    }

    input[type="date"]:focus, select:focus {
      outline: none;
      border-color: var(--text);
    }

    select { cursor: pointer; }

    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-secondary {
      background: var(--hover);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover { background: #eee; }

    .btn-primary {
      background: var(--text);
      color: white;
      margin-left: auto;
    }

    .btn-primary:hover { background: #1e1e24; }
    .btn-primary:disabled { background: #999; cursor: not-allowed; }

    #status {
      text-align: center;
      padding: 8px;
      font-size: 14px;
      min-height: 32px;
    }

    #status.error { color: #dc3545; }
    #status.success { color: #28a745; }

    .output-section {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }

    .output-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--hover);
    }

    .output-header span {
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
    }

    .copy-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      opacity: 0.6;
      transition: opacity 0.15s;
    }

    .copy-btn:hover { opacity: 1; }
    .copy-btn svg { width: 16px; height: 16px; fill: var(--text); }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--text);
      color: white;
      padding: 10px 20px;
      border-radius: 6px;
      font-size: 14px;
      opacity: 0;
      transition: transform 0.2s, opacity 0.2s;
      pointer-events: none;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    #output {
      font-family: monospace;
      font-size: 13px;
      padding: 16px;
      min-height: 80px;
      white-space: pre-wrap;
      word-break: break-all;
    }

    footer {
      text-align: center;
      margin-top: 24px;
      font-size: 13px;
      color: var(--muted);
    }

    footer a { color: var(--text); text-decoration: none; }
    footer a:hover { text-decoration: underline; }

    .hint {
      font-size: 12px;
      color: var(--muted);
      margin-top: 8px;
    }

    @media (max-width: 480px) {
      .controls { flex-direction: column; }
      .btn-primary { margin-left: 0; margin-top: 8px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Pip Time Machine ⏱️</h1>
    <p class="tagline">Find Python package versions available on any date</p>
  </header>

  <main>
    <div class="input-section">
      <textarea id="input" placeholder="requests&#10;numpy&#10;pandas"></textarea>
      <div class="controls">
        <input type="date" id="date" required>
        <select id="specifier" title="Version specifier">
          <option value="==">==</option>
          <option value=">=">>=</option>
          <option value="~=">~=</option>
          <option value="<="><=</option>
        </select>
        <button type="button" class="btn btn-secondary" id="today-btn">Today</button>
        <button type="button" class="btn btn-primary" id="process-btn">Process</button>
      </div>
      <p class="hint">Ctrl+Enter to process</p>
    </div>

    <div id="status"></div>

    <div class="output-section">
      <div class="output-header">
        <span>Output</span>
        <button class="copy-btn" id="copy-btn" title="Copy to clipboard">
          <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
        </button>
      </div>
      <pre id="output"></pre>
    </div>
  </main>

  <footer>
    <a href="https://github.com/f3dai/pip-time-machine">GitHub</a>
  </footer>

  <div class="toast" id="toast">Copied!</div>

  <script src="static/js/app.js"></script>
</body>
</html>
